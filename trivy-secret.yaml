rules:
  # Same definition as the built-in rule "private-key", but escalated to critical
  # in order to flag keys left in the container when the system has not been unsubscribed
  - id: asymmetric-private-key-critical
    category: private-key
    title: Asymmetric Private Key (Escalated)
    severity: CRITICAL
    regex: '(?i)-----\s*?BEGIN[ A-Z0-9_-]*?PRIVATE KEY( BLOCK)?\s*?-----[\s]*?(?P<secret>[A-Za-z0-9=+/\\][A-Za-z0-9=+/\\\s]{30,}[A-Za-z0-9=+/\\])[\s]*?-----\s*?END[ A-Z0-9_-]*? PRIVATE KEY( BLOCK)?\s*?-----'

name: Build Execution Environments

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push-ee:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        aap_version: ["2.4", "2.5", "2.6", "2.7"]
    uses: ./.github/workflows/_build-push-ee.yml
    with:
      aap_version: ${{ matrix.aap_version }}
    secrets:
      container_registry_username: ${{ secrets.QUAY_USER }}
      container_registry_password: ${{ secrets.QUAY_TOKEN }}
      redhat_org: ${{ secrets.REDHAT_ORG }}
      redhat_activation_key: ${{ secrets.REDHAT_ACTIVATION_KEY }}
      redhat_username: ${{ secrets.REDHAT_USERNAME }}
      redhat_password: ${{ secrets.REDHAT_PASSWORD }}
      ah_token_validated: ${{ secrets.AH_TOKEN_VALIDATED }}
      ah_token_certified: ${{ secrets.AH_TOKEN_CERTIFIED }}

  release:
    needs: build-and-push-ee
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # Note: We checkout the repository at the branch that triggered the workflow.
      # Python Semantic Release will automatically convert shallow clones to full clones
      # if needed to ensure proper history evaluation. However, we forcefully reset the
      # branch to the workflow sha because it is possible that the branch was updated
      # while the workflow was running, which prevents accidentally releasing un-evaluated
      # changes.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Action | Semantic Version Release
        id: release
        # Adjust tag with desired version if applicable.
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      - name: Publish | Upload to GitHub Release Assets
        uses: python-semantic-release/publish-action@v10.5.3
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

